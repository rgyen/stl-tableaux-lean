name = "STLTableaux"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["STLTableaux"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's header linter requires an Apache 2.0 license notice.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "STLTableaux"
globs = ["STLTableaux.*"]

[[lean_lib]]
name = "STLTableauxTest"
globs = ["STLTableauxTest.+"]
